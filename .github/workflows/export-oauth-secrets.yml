name: Export Aether OAuth secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: deploy/aether-oauth-artifact-recipient.pem
          sparse-checkout-cone-mode: false

      - name: Encrypt and authenticate OAuth runtime secrets for Aether
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OAUTH_ARTIFACT_HMAC_KEY: ${{ secrets.OAUTH_ARTIFACT_HMAC_KEY }}
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_REF: ${{ github.ref }}
          ARTIFACT_SHA: ${{ github.sha }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$ADMIN_EMAIL"
          test -n "$OAUTH_ARTIFACT_HMAC_KEY"
          install -d -m 0700 oauth-artifact

          python3 - <<'PY' | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -out oauth-artifact/oauth-secrets.cms \
            deploy/aether-oauth-artifact-recipient.pem
          import os
          import sys

          names = ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "ADMIN_EMAIL")
          values = {name: os.environ[name] for name in names}
          if any(not value or any(c in value for c in "\r\n\0") for value in values.values()):
              raise SystemExit("OAuth secret validation failed")
          sys.stdout.write("".join(f"{name}={values[name]}\n" for name in names))
          PY

          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path
          import time

          directory = Path("oauth-artifact")
          ciphertext = (directory / "oauth-secrets.cms").read_bytes()
          if not ciphertext:
              raise SystemExit("encrypted artifact is empty")
          metadata = {
              "created_at": int(time.time()),
              "ref": os.environ["ARTIFACT_REF"],
              "repository": os.environ["ARTIFACT_REPOSITORY"],
              "run_attempt": int(os.environ["ARTIFACT_RUN_ATTEMPT"]),
              "run_id": int(os.environ["ARTIFACT_RUN_ID"]),
              "sha": os.environ["ARTIFACT_SHA"],
          }
          encoded = json.dumps(metadata, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(
              os.environ["OAUTH_ARTIFACT_HMAC_KEY"].encode(),
              encoded + b"\0" + ciphertext,
              hashlib.sha256,
          ).hexdigest()
          (directory / "metadata.json").write_bytes(encoded)
          (directory / "signature.hex").write_text(signature + "\n", encoding="ascii")
          PY

      - name: Upload encrypted authenticated artifact only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leos-oauth-${{ github.run_id }}
          path: oauth-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
