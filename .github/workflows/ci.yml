# 어떤 에이전트/사람이 올리든 같은 검사를 통과해야 한다 (AGENTS.md 검증 항목).
# pre-commit 훅은 --no-verify로 건너뛸 수 있어서, 여기서 한 번 더 막는다.
# main에 들어오면 검사 통과 후 k3s(arm64)용 이미지를 GHCR에 올린다. 배포(매니페스트 태그 갱신)는 GitOps 쪽.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Containerfile과 같은 버전
          cache: npm
      - run: npm ci
      - name: 디자인 규칙
        run: npm run check:design
      - name: Self-check (auth, 본문 변환, 글 등록 검증)
        run: npm run check
      - name: 빌드
        run: npm run build

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # k3s 노드가 arm64 → GitHub 무료 ARM 러너(공개 저장소)에서 네이티브 빌드. QEMU 에뮬레이션보다 훨씬 빠름
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      # 태그 규칙은 aether-gitops와 같다: main-<git sha>, latest 사용 금지
      IMAGE: ghcr.io/tpals0409/leo-s-build-log
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지 주소
        run: printf '### 이미지\n`%s:main-%s`\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
