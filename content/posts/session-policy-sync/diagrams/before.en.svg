<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 870.812px; background-color: transparent;" viewBox="4 4 870.8 103" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:Gmarket Sans,Gmarket Sans TTF,-apple-system,Apple SD Gothic Neo,sans-serif;font-size:14px;fill:#292725;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#FFFFFF;}#my-svg .error-text{fill:#292725;stroke:#292725;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#696866;stroke:#696866;}#my-svg .marker.cross{stroke:#696866;}#my-svg svg{font-family:Gmarket Sans,Gmarket Sans TTF,-apple-system,Apple SD Gothic Neo,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .label{font-family:Gmarket Sans,Gmarket Sans TTF,-apple-system,Apple SD Gothic Neo,sans-serif;color:#292725;}#my-svg .cluster-label text{fill:#292725;}#my-svg .cluster-label span{color:#292725;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#292725;color:#292725;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#FFFFFF;stroke:#292725;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;